<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista previa: la ruleta girando</title>
<style>
  body { background:#0A1017; margin:0; padding:10px; }
  iframe { width:1380px; height:990px; border:1px solid #223; }
</style>
</head>
<body>
<!-- Solo para la captura: abre la ruleta del torneo real, marca "permitir
     repetir" (ese torneo ya tiene todos los cruces) y gira dos veces.
     NO apunta ningún partido ni crea nada. -->
<iframe id="marco" src="../partidos.html?torneo=t-mu368zeqaawp"></iframe>
<script>
const marco = document.getElementById('marco');
const esperar = ms => new Promise(r => setTimeout(r, ms));

marco.onload = async () => {
  // ¡Ojo! Sin esto el handler se vuelve a ejecutar cada vez que el iframe
  // navega y se monta un bucle (llegó a crear 30 torneos de basura).
  marco.onload = null;

  const t0 = Date.now();
  while (Date.now() - t0 < 25000) {
    await esperar(300);
    if (marco.contentWindow && marco.contentWindow.__listo) break;
  }

  const d = marco.contentDocument;
  d.getElementById('btn-ruleta').click();
  await esperar(500);

  // Este torneo trae el calendario completo: todos los cruces ya existen
  d.getElementById('ruleta-repetir').checked = true;

  d.getElementById('ruleta-girar').click();
  await esperar(4400);
  d.getElementById('ruleta-girar').click();
  await esperar(4400);
  document.title = 'vista-ok';
};
</script>
</body>
</html>
