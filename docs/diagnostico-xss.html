<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diagnóstico: XSS con nombres de torneo/jugador</title>
<style>
  body { background:#0A1017; color:#DFE8F2; font-family:ui-monospace,monospace; padding:16px; }
  iframe { width:1200px; height:400px; border:1px solid #223; }
  pre { background:#0E1621; padding:14px; border-radius:10px; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<h2 style="color:#00E676;font-size:16px">¿Se puede colar código en los nombres? (solo localStorage del test)</h2>
<iframe id="marco"></iframe>
<pre id="resultado">Ejecutando…</pre>

<script>
/* Este diagnóstico NO toca la nube: rellena el almacén local del navegador de
   pruebas con un torneo cuyo nombre intenta colar código, y mira qué pasa.
   Además acaba borrando ese almacén para no dejar rastro. */

const OK = (t, b, e) => (b ? '[OK] ' : '[FALLO] ') + t + (e ? '  → ' + e : '');
const esperar = ms => new Promise(r => setTimeout(r, ms));
const salida = [];
const marco = document.getElementById('marco');

function cargar(url) {
  return new Promise(r => { marco.onload = () => r(); marco.src = url; });
}
function esperarListo(intentos = 150) {
  return new Promise(r => {
    let n = 0;
    const tic = setInterval(() => {
      let listo = false;
      try { listo = marco.contentWindow.__listo === true; } catch (e) {}
      if (listo) { clearInterval(tic); r(true); } else if (++n > intentos) { clearInterval(tic); r(false); }
    }, 100);
  });
}

const MALO_TORNEO = 'Torneo <img src=xx onerror="window.__xssTorneo=1">';
const MALO_JUGADOR = '<img src=xx onerror="window.__xssJugador=1">Luis';

const torneo = {
  id: 't-xss', nombre: MALO_TORNEO, estado: 'en_curso',
  config: { codigo: 'XXXXXX', vueltas: 1, clasificados: 2, puntosVictoria: 3, puntosEmpate: 1, puntosDerrota: 0,
            desempates: ['diferenciaGoles'], tiposGol: [], formato: 'liguilla' },
  jugadores: [ { id: 'j-x1', nombre: MALO_JUGADOR, emoji: '🟢', color: '#00E676' },
               { id: 'j-x2', nombre: 'Otro', emoji: '🔵', color: '#4DA3FF' } ],
  futbolistas: [],
  partidos: [ { id: 'p-x1', fase: 'liga', jornada: 1, localId: 'j-x1', visitanteId: 'j-x2',
                golesLocal: 0, golesVisitante: 0, jugado: false, goles: [], stats: null, fecha: null } ]
};

(async () => {
  try {
    // 1. Preparo los datos "envenenados" en el almacén local del navegador de pruebas
    localStorage.setItem('torneos-efootball-v1', JSON.stringify([torneo]));
    localStorage.setItem('torneo-activo', 't-xss');

    // 2. Portada: el nombre del torneo
    await cargar('../index.html?local=1');
    await esperarListo();
    await esperar(600);
    let w = marco.contentWindow;
    salida.push(OK('modo local en la prueba (no toca la nube)', w.Store && w.Store.modo() === 'local',
      w.Store ? w.Store.modo() : '?'));
    salida.push(OK('el nombre del torneo NO ejecuta código', w.__xssTorneo !== 1,
      w.__xssTorneo === 1 ? '¡SE EJECUTÓ!' : 'no se ejecutó'));
    const tarjeta = marco.contentDocument.querySelector('#lista-torneos h3');
    salida.push(OK('el nombre se pinta como TEXTO (no como HTML)',
      Boolean(tarjeta) && !tarjeta.querySelector('img') &&
      tarjeta.textContent.includes('<img'),
      tarjeta ? 'contiene ' + (tarjeta.querySelector('img') ? 'una etiqueta img' : 'solo texto') : 'sin tarjeta'));

    // 3. Clasificación: el nombre del jugador
    await cargar('../clasificacion.html?torneo=t-xss&local=1');
    await esperarListo();
    await esperar(600);
    w = marco.contentWindow;
    salida.push(OK('el nombre del jugador NO ejecuta código', w.__xssJugador !== 1,
      w.__xssJugador === 1 ? '¡SE EJECUTÓ!' : 'no se ejecutó'));
    const celda = marco.contentDocument.querySelector('#tabla-clasificacion td.jugador');
    salida.push(OK('el nombre del jugador se pinta como TEXTO',
      Boolean(celda) && !celda.querySelector('img'),
      celda ? 'contiene ' + (celda.querySelector('img') ? 'una etiqueta img' : 'solo texto') : 'sin tabla'));

    // 4. Limpieza: fuera los datos del test
    localStorage.removeItem('torneos-efootball-v1');
    localStorage.removeItem('torneo-activo');
    salida.push(OK('limpieza del almacén de pruebas', localStorage.getItem('torneos-efootball-v1') === null));
  } catch (e) {
    salida.push('[EXCEPCIÓN] ' + e.message);
  }

  const fallos = salida.filter(l => l.startsWith('[FALLO') || l.startsWith('[EXCE')).length;
  document.getElementById('resultado').textContent =
    '¿Dónde se colaron el torneo y el jugador?\n\n' + salida.join('\n') + '\n\n' +
    (fallos === 0 ? '✅ NADA SE COLÓ: los nombres se pintan como texto' : '⚠️ ' + fallos + ' puntos donde SÍ se cuela código');
  document.title = 'diag-lista';
})();
</script>
</body>
</html>
