<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista previa: filtros en la paleta morada</title>
<style>
  body { background:#0A1017; margin:0; padding:10px; }
  iframe { width:1520px; height:640px; border:1px solid #223; }
</style>
</head>
<body>
<!-- Solo para la captura: abre Partidos con la paleta morada -->
<iframe id="marco" src="../partidos.html"></iframe>
<script>
const marco = document.getElementById('marco');
const esperar = ms => new Promise(r => setTimeout(r, ms));

marco.onload = async () => {
  marco.onload = null;
  const t0 = Date.now();
  while (Date.now() - t0 < 25000) {
    await esperar(300);
    if (marco.contentWindow && marco.contentWindow.__listo) break;
  }
  marco.contentWindow.aplicarTema('morado');
  await esperar(600);
  // Se deja marcado "Pendientes" (ámbar) para que se vea el contraste
  const tab = marco.contentDocument.querySelector('.tab[data-filtro="pendientes"]');
  if (tab) tab.click();
  await esperar(500);
  document.title = 'vista-ok';
};
</script>
</body>
</html>
