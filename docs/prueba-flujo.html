<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de flujo</title>
  <style>
    body { background:#070B12; color:#E8F2FF; font-family: monospace; margin:0; padding:12px; }
    iframe { width:1560px; height:820px; border:1px solid #1E2E42; border-radius:8px; }
    pre { font-size:15px; white-space:pre-wrap; margin:0 0 12px; line-height:1.5; }
  </style>
</head>
<body>
<pre id="resultado">ejecutando prueba...</pre>
<iframe id="marco" src="../index.html"></iframe>

<script>
/* Prueba de humo: simula un usuario apuntando un resultado en la portada y
   comprueba que se guarda, que la clasificación se recalcula y que los
   mensajes de error/estado funcionan. Funciona en modo local y en modo nube.
   Se abre en el navegador (o headless) y deja el resultado escrito arriba. */

const salida = [];
function ok(nombre, condicion, detalle) {
  salida.push((condicion ? '[OK   ] ' : '[FALLO] ') + nombre + (detalle ? ' → ' + detalle : ''));
  return condicion;
}

/* La portada ahora carga los datos de forma asíncrona: esperamos a que avise
   de que está lista (window.__listo) antes de hacer clic en nada. */
function esperarListo(marco, intentos) {
  return new Promise((resolver, rechazar) => {
    let n = 0;
    const tic = setInterval(() => {
      let listo = false;
      try { listo = marco.contentWindow.__listo === true; } catch (e) {}
      if (listo) { clearInterval(tic); resolver(); }
      else if (++n > (intentos || 100)) { clearInterval(tic); rechazar(new Error('la web no terminó de cargar')); }
    }, 100);
  });
}

document.getElementById('marco').onload = async () => {
  const marco = document.getElementById('marco');
  const d = marco.contentDocument;
  const w = marco.contentWindow;

  try {
    await esperarListo(marco);

    // 1. La tabla de clasificación se ha pintado
    const filas = d.querySelectorAll('#tabla-clasificacion tbody tr');
    ok('la clasificación tiene 6 filas', filas.length === 6, filas.length + ' filas');

    // 2. Se avisa del modo de datos (nube o local)
    const modo = d.getElementById('nota-guardado').textContent.trim();
    ok('la web dice en qué modo está', /nube|local/i.test(modo), modo);

    // 3. Estado inicial del resumen (vale cualquier punto de partida: en la nube
    //    puede haber ya resultados de otros, así que guardamos el número y
    //    comprobamos que SUBE uno al guardar)
    const resumenInicial = d.getElementById('resumen').textContent;
    const coincide = resumenInicial.match(/(\d+)\s*\/\s*(\d+)/);
    const jugadosAntes = coincide ? Number(coincide[1]) : null;
    ok('el resumen muestra los partidos jugados', jugadosAntes !== null,
       jugadosAntes + ' jugados de ' + (coincide ? coincide[2] : '?'));

    // 4. Buscar un partido pendiente y pulsar Apuntar
    const botonApuntar = Array.from(d.querySelectorAll('.btn-mini-ir'))
      .find(b => b.textContent.trim() === 'Apuntar');
    ok('hay un partido pendiente con botón Apuntar', !!botonApuntar);
    botonApuntar.click();

    // 5. La ventanita se abre (y se ve de verdad)
    ok('la ventanita se abre', d.getElementById('modal-fondo').hidden === false);
    const displayAbierto = w.getComputedStyle(d.getElementById('modal-fondo')).display;
    ok('la ventanita se ve de verdad (no está oculta por CSS)', displayAbierto !== 'none', 'display: ' + displayAbierto);

    // 6. Poner un 2-0 con los botones
    const masLocal = d.querySelector('[data-modal-paso="local"][data-delta="1"]');
    const masVisit = d.querySelector('[data-modal-paso="visitante"][data-delta="1"]');
    masVisit.click();           // primero uno de más, para probar el botón de quitar
    d.querySelector('[data-modal-paso="visitante"][data-delta="-1"]').click();
    masLocal.click(); masLocal.click();
    const marcaLocal = d.getElementById('modal-cifra-local').textContent;
    const marcaVisit = d.getElementById('modal-cifra-visit').textContent;
    ok('el marcador de la ventanita marca 2-0', marcaLocal === '2' && marcaVisit === '0', marcaLocal + '-' + marcaVisit);

    // 7. Guardar (ahora es asíncrono: hay que darle tiempo)
    d.getElementById('modal-guardar').click();
    await new Promise(r => setTimeout(r, 900));
    ok('la ventanita se cierra al guardar', d.getElementById('modal-fondo').hidden === true);
    const displayCerrado = w.getComputedStyle(d.getElementById('modal-fondo')).display;
    ok('la ventanita queda invisible de verdad', displayCerrado === 'none', 'display: ' + displayCerrado);

    // 8. El resumen cuenta un partido más que antes
    const resumenDespues = d.getElementById('resumen').textContent;
    const coincideDespues = resumenDespues.match(/(\d+)\s*\/\s*(\d+)/);
    const jugadosDespues = coincideDespues ? Number(coincideDespues[1]) : null;
    ok('el resumen sube exactamente un partido', jugadosDespues === jugadosAntes + 1,
       jugadosAntes + ' → ' + jugadosDespues + ' jugados');

    // 9. El resultado aparece en la lista
    ok('el resultado 2 - 0 aparece en la lista', d.getElementById('lista-partidos').textContent.includes('2 - 0'));

    // 10. Y se guarda de verdad (en el navegador o en la nube)
    const modoNube = /nube/i.test(modo);
    if (modoNube) {
      ok('modo nube: hay conexión configurada', true, 'se comprueba al recargar');
      // Recargar desde la nube: el resultado debe seguir ahí
      d.getElementById('btn-refrescar').click();
      await new Promise(r => setTimeout(r, 1800));
      ok('tras refrescar desde la nube el resultado sigue', d.getElementById('lista-partidos').textContent.includes('2 - 0'));
    } else {
      ok('modo local: los datos quedan guardados en el navegador', !!localStorage.getItem('torneos-efootball-v1'));
    }

    // 11. Las eliminatorias siguen mostrando 2 cruces
    const cruces = d.querySelectorAll('#lista-eliminatorias .partido-fila');
    ok('las eliminatorias muestran 2 cruces', cruces.length === 2, cruces.length + ' cruces');

    // 12. Reabrir para editar y comprobar el botón de borrar
    const botonEditar = Array.from(d.querySelectorAll('.btn-mini-ir'))
      .find(b => b.textContent.trim() === 'Editar');
    botonEditar.click();
    ok('se puede reabrir para editar', d.getElementById('modal-fondo').hidden === false);
    ok('el botón de borrar aparece al editar', d.getElementById('modal-borrar').hidden === false);

  } catch (e) {
    salida.push('[EXCEPCIÓN] ' + e.message);
  }

  const fallos = salida.filter(l => !l.startsWith('[OK')).length;
  document.getElementById('resultado').textContent =
    salida.join('\n') + '\n\n' + (fallos === 0 ? '✅ PRUEBA COMPLETA: TODO CORRECTO' : '❌ ' + fallos + ' fallos');
  document.title = fallos === 0 ? 'PRUEBA-OK' : 'PRUEBA-FALLIDA';
};
</script>
</body>
</html>
