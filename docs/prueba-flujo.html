<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de flujo</title>
  <style>
    body { background:#070B12; color:#E8F2FF; font-family: monospace; margin:0; padding:12px; }
    iframe { width:1560px; height:820px; border:1px solid #1E2E42; border-radius:8px; }
    pre { font-size:15px; white-space:pre-wrap; margin:0 0 12px; line-height:1.5; }
  </style>
</head>
<body>
<pre id="resultado">ejecutando prueba...</pre>
<iframe id="marco" src="../partidos.html"></iframe>

<script>
/* Prueba de humo de la página de PARTIDOS: apunta un resultado, comprueba que
   se guarda, que el progreso sube y que el resultado aparece en la lista.
   Funciona igual en modo local y en modo nube (en nube refresca de verdad). */

const salida = [];
function ok(nombre, condicion, detalle) {
  salida.push((condicion ? '[OK   ] ' : '[FALLO] ') + nombre + (detalle ? ' → ' + detalle : ''));
  return condicion;
}
const esperar = (ms) => new Promise(r => setTimeout(r, ms));

function esperarListo(marco, intentos) {
  return new Promise((resolver, rechazar) => {
    let n = 0;
    const tic = setInterval(() => {
      let listo = false;
      try { listo = marco.contentWindow.__listo === true; } catch (e) {}
      if (listo) { clearInterval(tic); resolver(); }
      else if (++n > (intentos || 150)) { clearInterval(tic); rechazar(new Error('la página no terminó de cargar')); }
    }, 100);
  });
}

/* Del texto "5/30" (o "5 de 30") saca el 5 y el total */
function jugadosDe(texto) {
  const m = String(texto).match(/(\d+)\s*(?:\/|de)\s*(\d+)/);
  return m ? { jugados: Number(m[1]), total: Number(m[2]) } : null;
}

/* El progreso de la liguilla se lee en el primer recuadro del resumen */
function progresoDe(d) {
  const valor = d.querySelector('#resumen-partidos .dato .valor');
  return jugadosDe(valor ? valor.textContent : '');
}

document.getElementById('marco').onload = async () => {
  // Desenganchamos el handler para que no se repita si el iframe navega
  document.getElementById('marco').onload = null;

  const marco = document.getElementById('marco');
  let d = marco.contentDocument;
  const w = marco.contentWindow;

  try {
    await esperarListo(marco);

    // 1. La página carga con los partidos
    const filas = d.querySelectorAll('#lista-partidos .partido-fila');
    ok('la lista de partidos tiene filas', filas.length > 0, filas.length + ' filas');

    // 2. Modo de datos
    const modo = d.getElementById('nota-guardado').textContent.trim();
    ok('la web dice en qué modo está', /nube|local/i.test(modo), modo);
    const modoNube = /nube/i.test(modo);

    // 3. Progreso inicial
    const antes = progresoDe(d);
    ok('el progreso se puede leer', !!antes, antes ? antes.jugados + ' de ' + antes.total : '—');

    // 4. Buscar un partido pendiente y pulsar Apuntar
    const botonApuntar = Array.from(d.querySelectorAll('.btn-mini-ir'))
      .find(b => b.textContent.trim() === 'Apuntar');
    ok('hay un partido pendiente con botón Apuntar', !!botonApuntar);
    botonApuntar.click();

    // 5. La ventanita se abre (y se ve de verdad)
    ok('la ventanita se abre', d.getElementById('modal-fondo').hidden === false);
    const displayAbierto = w.getComputedStyle(d.getElementById('modal-fondo')).display;
    ok('la ventanita se ve de verdad', displayAbierto !== 'none', 'display: ' + displayAbierto);

    // 6. Poner un 2-0 (probando también el botón de quitar)
    const masLocal = d.querySelector('[data-modal-paso="local"][data-delta="1"]');
    const masVisit = d.querySelector('[data-modal-paso="visitante"][data-delta="1"]');
    masVisit.click();
    d.querySelector('[data-modal-paso="visitante"][data-delta="-1"]').click();
    masLocal.click(); masLocal.click();
    const marcaLocal = d.getElementById('modal-cifra-local').textContent;
    const marcaVisit = d.getElementById('modal-cifra-visit').textContent;
    ok('el marcador de la ventanita marca 2-0', marcaLocal === '2' && marcaVisit === '0', marcaLocal + '-' + marcaVisit);

    // 7. Guardar
    d.getElementById('modal-guardar').click();
    await esperar(1200);
    ok('la ventanita se cierra al guardar', d.getElementById('modal-fondo').hidden === true);
    const displayCerrado = w.getComputedStyle(d.getElementById('modal-fondo')).display;
    ok('la ventanita queda invisible de verdad', displayCerrado === 'none', 'display: ' + displayCerrado);

    // 8. El progreso sube exactamente un partido
    const despues = progresoDe(d);
    ok('el progreso sube un partido', despues && antes && despues.jugados === antes.jugados + 1,
       (antes ? antes.jugados : '?') + ' → ' + (despues ? despues.jugados : '?'));

    // 9. El resultado aparece en la lista
    ok('el resultado 2 - 0 aparece en la lista', d.getElementById('lista-partidos').textContent.includes('2 - 0'));

    // 10. En modo nube: recargar la página (F5) y comprobar que sigue ahí.
    //     El botón de refrescar ya no existe: ahora se recarga la página.
    if (modoNube) {
      const marcoEl = document.getElementById('marco');
      const recargada = new Promise(res => {
        marcoEl.addEventListener('load', res, { once: true });
        d.defaultView.location.reload();
      });
      await recargada;
      await esperarListo(marcoEl);
      await esperar(600);
      d = marcoEl.contentDocument;

      const trasRefresco = progresoDe(d);
      ok('tras recargar desde la nube el resultado sigue',
         trasRefresco && trasRefresco.jugados === despues.jugados,
         trasRefresco ? trasRefresco.jugados + ' jugados' : '—');
    } else {
      ok('modo local: los datos quedan en el navegador', true, 'localStorage');
    }

    // 11. Reabrir para editar
    const botonEditar = Array.from(d.querySelectorAll('.btn-mini-ir'))
      .find(b => b.textContent.trim() === 'Editar');
    botonEditar.click();
    ok('se puede reabrir para editar', d.getElementById('modal-fondo').hidden === false);
    ok('el botón de borrar aparece al editar', d.getElementById('modal-borrar').hidden === false);

    // 12. Y borrar el resultado para dejar el torneo como estaba (prueba el borrado
    //     y así la prueba no ensucia los datos de verdad)
    d.getElementById('modal-borrar').click();
    await esperar(1200);
    const final = progresoDe(d);
    ok('el resultado se borra y el partido vuelve a estar pendiente',
       final && antes && final.jugados === antes.jugados,
       (despues ? despues.jugados : '?') + ' → ' + (final ? final.jugados : '?') + ' jugados');

    // 13. La barra de arriba: cuántos jugadores hay y el menú lateral plegable
    ok('la barra de arriba dice cuántos jugadores hay',
       /jugadores/.test(d.getElementById('progreso').textContent),
       d.getElementById('progreso').textContent.trim());

    const sidebar = d.getElementById('sidebar');
    const botonPlegar = d.getElementById('btn-plegar');
    ok('el menú lateral existe y tiene el botón de plegar', !!sidebar && !!botonPlegar);
    ok('el menú lateral trae "Volver al menú" (vuelve a la portada)',
       !!Array.from(sidebar.querySelectorAll('a')).find(a =>
         /volver al menú/i.test(a.textContent) && /index\.html/.test(a.getAttribute('href') || '')),
       Array.from(sidebar.querySelectorAll('a')).map(a => a.textContent.trim()).join(' | '));

    const anchoAntes = sidebar.getBoundingClientRect().width;
    botonPlegar.click();
    await esperar(500);
    // El estado se comprueba por la clase (el ancho depende de la animación)
    ok('al plegarlo, el menú se queda solo con los iconos',
       sidebar.classList.contains('plegado') && d.querySelector('.layout').classList.contains('plegado'),
       Math.round(anchoAntes) + 'px → ' + Math.round(sidebar.getBoundingClientRect().width) + 'px');
    ok('al plegarlo tampoco se ven los emojis del menú',
       d.defaultView.getComputedStyle(sidebar.querySelector('nav')).display === 'none',
       'nav oculto');

    botonPlegar.click();
    await esperar(500);
    ok('al volver a pulsar se despliega otra vez',
       !sidebar.classList.contains('plegado') && !d.querySelector('.layout').classList.contains('plegado'),
       'clase "plegado" quitada');

    ok('el menú de arriba a la derecha ya no existe', !d.getElementById('btn-menu'));

    // El botón de actualizar: solo tiene sentido con los datos en la nube
    const botonAct = d.getElementById('btn-actualizar');
    ok('el botón de actualizar sale cuando los datos están en la nube',
       modoNube ? (Boolean(botonAct) && /Actualizar/.test(botonAct.textContent)) : !botonAct,
       modoNube ? 'está en la barra (modo nube)' : 'no sale en modo local, y es correcto');
    ok('el botón de refrescar viejo sigue fuera', !d.getElementById('btn-refrescar'));

    // Y funciona: al pulsarlo vuelve a leer (solo lee, no escribe nada)
    if (botonAct) {
      const filasAntes = d.querySelectorAll('#lista-partidos .partido-fila').length;
      botonAct.click();
      await esperar(3000);
      const filasDespues = d.querySelectorAll('#lista-partidos .partido-fila').length;
      ok('al pulsar Actualizar la lista se repinta sin romperse',
         filasAntes > 0 && filasDespues === filasAntes,
         filasAntes + ' → ' + filasDespues + ' partidos');
    } else {
      ok('sin botón de actualizar no hay nada que pulsar', true, 'omitido en modo local');
    }

    // 14. Los filtros de partidos: cada uno con su color
    const colorFiltro = f => d.defaultView.getComputedStyle(d.querySelector('.tab[data-filtro="' + f + '"]')).color;
    const coloresFiltros = {
      todos: colorFiltro('todos'),
      pendientes: colorFiltro('pendientes'),
      jugados: colorFiltro('jugados'),
      proximos: colorFiltro('proximos')
    };
    ok('los cuatro filtros tienen colores distintos entre sí',
       new Set(Object.values(coloresFiltros)).size === 4,
       Object.entries(coloresFiltros).map(([k, v]) => k + '=' + v).join('  '));
    ok('pendientes va en ámbar y jugados en verde',
       coloresFiltros.pendientes === 'rgb(245, 158, 11)' && coloresFiltros.jugados === 'rgb(16, 185, 129)',
       'pendientes ' + coloresFiltros.pendientes + ' · jugados ' + coloresFiltros.jugados);
    ok('la jornada en curso va en azul',
       coloresFiltros.proximos === 'rgb(77, 163, 255)', coloresFiltros.proximos);

    // 15. Recuadros del resumen y menú lateral: cada uno con su color
    const colorTexto = nodo => d.defaultView.getComputedStyle(nodo).color;

    const recuadros = Array.from(d.querySelectorAll('#resumen-partidos .dato'));
    const valoresResumen = Array.from(d.querySelectorAll('#resumen-partidos .dato .valor')).map(colorTexto);
    ok('los recuadros del resumen tienen su color propio',
       recuadros.length === 3 && valoresResumen.length === 2 &&
       new Set(valoresResumen).size === valoresResumen.length,
       recuadros.length + ' recuadros · colores: ' + valoresResumen.join('  '));
    ok('partidos jugados en verde y goles en ámbar',
       valoresResumen[0] === 'rgb(16, 185, 129)' && valoresResumen[1] === 'rgb(245, 158, 11)',
       valoresResumen.slice(0, 2).join('  '));

    // 15b. Los recuadros: etiqueta en su propia línea y números alineados entre sí
    const etiquetaDato = d.defaultView.getComputedStyle(
      d.querySelector('#resumen-partidos .dato .etiqueta'));
    ok('la etiqueta del recuadro va en su línea (display: block)',
       etiquetaDato.display === 'block', etiquetaDato.display);

    const alturas = Array.from(d.querySelectorAll('#resumen-partidos .dato .valor'))
      .map(n => Math.round(n.getBoundingClientRect().top));
    const desnivel = Math.max(...alturas) - Math.min(...alturas);
    ok('los números del resumen están alineados (el número no baila)',
       alturas.length >= 2 && desnivel <= 2,
       'alturas: ' + alturas.join(', ') + ' · desnivel ' + desnivel + 'px');

    const colorNav = c => colorTexto(d.querySelector('.nav-item.' + c));
    ok('el menú lateral pone su color a cada sección',
       colorNav('nav-clasificacion') === 'rgb(245, 158, 11)' &&
       colorNav('nav-partidos') === 'rgb(77, 163, 255)' &&
       colorNav('nav-eliminatorias') === 'rgb(179, 136, 255)' &&
       colorNav('nav-estadisticas') === 'rgb(16, 185, 129)',
       ['clasificacion', 'partidos', 'eliminatorias', 'estadisticas']
         .map(c => c + '=' + colorNav('nav-' + c)).join('  '));

  } catch (e) {
    salida.push('[EXCEPCIÓN] ' + e.message);
  }

  const fallos = salida.filter(l => l.startsWith('[FALLO') || l.startsWith('[EXCE')).length;
  document.getElementById('resultado').textContent =
    salida.join('\n') + '\n\n' + (fallos === 0 ? '✅ PRUEBA COMPLETA: TODO CORRECTO' : '❌ ' + fallos + ' fallos');
  document.title = fallos === 0 ? 'PRUEBA-OK' : 'PRUEBA-FALLIDA';
};
</script>
</body>
</html>
