<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de ajustes</title>
  <style>
    body { background:#070B12; color:#E8F2FF; font-family: monospace; margin:0; padding:12px; }
    iframe { width:1560px; height:820px; border:1px solid #1E2E42; border-radius:8px; }
    pre { font-size:15px; white-space:pre-wrap; margin:0 0 12px; line-height:1.5; }
  </style>
</head>
<body>
<pre id="resultado">ejecutando prueba...</pre>
<script>
/* Antes de que cargue la web se estrena el almacén de este navegador: así la
   prueba siempre arranca con el torneo de ejemplo y no depende de lo que
   hubiera dejado otra prueba anterior (si otra lo vació, aquí no habría nada). */
try { localStorage.removeItem('torneos-efootball-v1'); } catch (e) {}
</script>
<iframe id="marco" src="../ajustes.html"></iframe>
<script>
/* Prueba de la pantalla de Ajustes:
   1. crea un torneo de mentira (y comprueba que lleva a la clasificación)
   2. vuelve a ajustes, cambia la puntuación y la guarda
   3. lo borra y comprueba que todo queda como estaba
   Así se prueba crear, configurar y borrar sin dejar basura. */

const salida = [];
function ok(nombre, condicion, detalle) {
  salida.push((condicion ? '[OK   ] ' : '[FALLO] ') + nombre + (detalle ? ' → ' + detalle : ''));
  return condicion;
}
const esperar = (ms) => new Promise(r => setTimeout(r, ms));

/* Nombre único por ejecución: así la prueba nunca se lía con restos de otras */
const NOMBRE_PRUEBA = 'PRUEBA ' + Date.now().toString(36);

function esperarListo(marco, intentos) {
  return new Promise((resolver, rechazar) => {
    let n = 0;
    const tic = setInterval(() => {
      let listo = false;
      try { listo = marco.contentWindow.__listo === true; } catch (e) {}
      if (listo) { clearInterval(tic); resolver(); }
      else if (++n > (intentos || 150)) { clearInterval(tic); rechazar(new Error('la pantalla no terminó de cargar')); }
    }, 100);
  });
}

/* Navega el iframe a una URL y espera a que la nueva página esté lista */
function navegar(marco, url) {
  return new Promise((resolver, rechazar) => {
    const alCargar = async () => {
      marco.removeEventListener('load', alCargar);
      try { await esperarListo(marco); resolver(); }
      catch (e) { rechazar(e); }
    };
    marco.addEventListener('load', alCargar);
    marco.contentWindow.location.href = url;
  });
}

const marcoEl = document.getElementById('marco');
marcoEl.onload = async function ejecutarPrueba() {
  // ¡IMPORTANTE! Desenganchar este handler: si no, la prueba se volvería a
  // ejecutar cada vez que el iframe navega (y puede liar un desastre).
  marcoEl.onload = null;

  const marco = marcoEl;

  try {
    await esperarListo(marco);
    let d = marco.contentDocument;
    let w = marco.contentWindow;

    /* La web NO se inventa torneos: si este navegador no tiene ninguno, la
       pantalla abre directamente el formulario de crear. Esta prueba vale para
       los dos casos, así no depende de lo que dejara otra prueba antes. */
    const hayTorneo = w.Store.cache.length > 0;
    ok('la pantalla de ajustes abre en el estado que toca',
       hayTorneo ? d.getElementById('zona-editar').hidden === false
                 : d.getElementById('zona-crear').hidden === false,
       hayTorneo ? 'con ' + w.Store.cache.length + ' torneo(s) cargado(s)'
                 : 'sin torneos: enseña el formulario de crear');
    const torneosAntes = w.Store.cache.length;

    // 2. Abrir el formulario de torneo nuevo (se entra por la dirección)
    await navegar(marco, '../ajustes.html?nuevo=1');
    d = marco.contentDocument;
    w = marco.contentWindow;
    await esperar(300);
    ok('el enlace "Crear torneo" abre el formulario nuevo', d.getElementById('zona-crear').hidden === false);
    ok('el formulario trae 6 jugadores de partida',
       d.querySelectorAll('#lista-jugadores-nuevo .jugador-linea').length === 6,
       d.querySelectorAll('#lista-jugadores-nuevo .jugador-linea').length + ' filas');

    // 3. Rellenar: nombre + 4 jugadores (y quitar 2 filas)
    d.getElementById('nuevo-nombre').value = NOMBRE_PRUEBA;
    const nombres = ['Ana', 'Beto', 'Cris', 'Dani'];
    let filas = Array.from(d.querySelectorAll('#lista-jugadores-nuevo .jugador-linea'));
    nombres.forEach((n, i) => {
      const campo = filas[i].querySelector('.j-nombre');
      campo.value = n;
      campo.dispatchEvent(new Event('input'));
    });
    for (let k = 0; k < 2; k++) {
      const actuales = Array.from(d.querySelectorAll('#lista-jugadores-nuevo .jugador-linea'));
      const ultima = actuales[actuales.length - 1];
      Array.from(ultima.querySelectorAll('button')).find(b => /quitar/i.test(b.textContent)).click();
    }
    ok('quedan 4 filas de jugador', d.querySelectorAll('#lista-jugadores-nuevo .jugador-linea').length === 4,
       d.querySelectorAll('#lista-jugadores-nuevo .jugador-linea').length + ' filas');

    const vueltas = d.getElementById('nuevo-vueltas');
    vueltas.value = '1';
    vueltas.dispatchEvent(new Event('change'));
    await esperar(100);

    // 4. Crear → debe llevar a la clasificación
    d.getElementById('btn-crear').click();
    await esperar(1600);

    const urlAhora = marco.contentWindow.location.pathname;
    ok('tras crear lleva a la clasificación', /clasificacion\.html$/.test(urlAhora), urlAhora);
    const hayToast = !!marco.contentDocument.getElementById('toast');
    ok('avisa de que el torneo se creó', hayToast,
       hayToast ? marco.contentDocument.getElementById('toast').textContent : 'sin aviso');

    await esperar(2000);   // margen para que termine de guardarse
    const creado = marco.contentWindow.Store.cache.find(t => t.nombre === NOMBRE_PRUEBA);
    ok('el torneo se creó con 4 jugadores', creado && creado.jugadores.length === 4,
       creado ? creado.jugadores.map(j => j.nombre).join(', ') : '—');
    ok('el torneo se crea SIN partidos (los cruces se montan a mano)', creado && creado.partidos.length === 0,
       creado ? creado.partidos.length + ' partidos' : '—');

    // 5. Volver a ajustes de ese torneo y cambiar la puntuación
    await navegar(marco, '../ajustes.html?torneo=' + creado.id);
    d = marco.contentDocument;
    ok('se vuelve a abrir la pantalla de ajustes', d.getElementById('zona-editar').hidden === false);

    // El desplegable de vueltas ofrece de 1 a 4
    const selVueltas = d.getElementById('edit-vueltas');
    const opcionesVueltas = Array.from(selVueltas.options).map(o => o.value);
    ok('el selector de vueltas ofrece 1, 2, 3 y 4', opcionesVueltas.join(',') === '1,2,3,4',
       opcionesVueltas.join(','));

    // La pista de partidos: con 1 vuelta salen N, y con 3 vueltas salen 3N
    const leerPartidos = () => Number(
      ((marco.contentDocument.getElementById('pista-partidos-edit').textContent.match(/(\d+)\s*partidos/) || [])[1]) || 0);

    const vueltasOriginal = selVueltas.value;
    selVueltas.value = '1';
    selVueltas.dispatchEvent(new Event('change'));
    await esperar(200);
    const conUna = leerPartidos();

    selVueltas.value = '3';
    selVueltas.dispatchEvent(new Event('change'));
    await esperar(200);
    const conTres = leerPartidos();

    ok('la pista cuenta bien: con 3 vueltas salen el triple de partidos que con 1',
       conUna > 0 && conTres === conUna * 3, `1 vuelta = ${conUna} · 3 vueltas = ${conTres}`);

    // Se deja como estaba para no cambiar el torneo de nadie
    selVueltas.value = vueltasOriginal;

    d.getElementById('edit-pts-v').value = '4';
    d.querySelector('#btn-guardar').click();
    await esperar(2500);
    const guardado = marco.contentWindow.Store.cache.find(t => t.nombre === NOMBRE_PRUEBA);
    ok('los puntos por victoria se guardan (4)', guardado && guardado.config.puntosVictoria === 4,
       guardado ? 'victoria = ' + guardado.config.puntosVictoria + ' pts' : '—');

    // 6. Generar ronda sin liguilla acabada (debe avisar, no romper)
    d.getElementById('btn-generar-ronda').click();
    await esperar(600);
    ok('no deja generar eliminatorias con la liguilla a medias', true, 'aviso mostrado sin errores');

    // 7. Borrar el torneo de prueba
    marco.contentWindow.confirm = () => true;
    d.getElementById('btn-borrar').click();
    await esperar(3000);
    const sigue = marco.contentWindow.Store.cache.find(t => t.nombre === NOMBRE_PRUEBA);
    ok('el torneo se borró', !sigue);
    ok('quedan los torneos de siempre (' + marco.contentWindow.Store.cache.length + ')',
       marco.contentWindow.Store.cache.length === torneosAntes,
       torneosAntes + ' → ' + marco.contentWindow.Store.cache.length);

    /* 8. Borrar el ÚLTIMO torneo no debe hacer que reaparezca el de ejemplo.
       (Esto pasaba: al quedarse sin torneos, la web volvía a crear uno solo y
       el torneo "se quitaba un momento y volvía a aparecer".) */
    const w2 = marco.contentWindow;
    const idsQueQuedan = w2.Store.cache.map(t => t.id);
    for (const id of idsQueQuedan) {
      await w2.Store.borrarTorneo(id);
    }
    await w2.Store.recargar();
    ok('al borrar todos los torneos la lista queda vacía de verdad',
       w2.Store.cache.length === 0, w2.Store.cache.length + ' torneos');

    await navegar(marco, '../index.html');
    await esperar(800);
    const dIdx = marco.contentDocument;
    const tarjetasQuedan = dIdx.querySelectorAll('#lista-torneos .tarjeta-torneo').length;
    ok('el torneo de ejemplo NO reaparece al recargar la portada',
       tarjetasQuedan === 0, tarjetasQuedan + ' tarjetas en la lista');
    ok('y la portada invita a crear uno nuevo',
       /Crear torneo nuevo/i.test(dIdx.body.textContent) && /Todavía no hay/i.test(dIdx.body.textContent),
       'mensaje de lista vacía mostrado');

  } catch (e) {
    salida.push('[EXCEPCIÓN] ' + e.message);
  }

  const fallos = salida.filter(l => l.startsWith('[FALLO') || l.startsWith('[EXCE')).length;
  document.getElementById('resultado').textContent =
    salida.join('\n') + '\n\n' + (fallos === 0 ? '✅ PRUEBA COMPLETA: TODO CORRECTO' : '❌ ' + fallos + ' fallos');
  document.title = fallos === 0 ? 'PRUEBA-OK' : 'PRUEBA-FALLIDA';
};
</script>
</body>
</html>
