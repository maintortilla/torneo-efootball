<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba: las paletas de color</title>
<style>
  body { background:#0A1017; color:#DFE8F2; font-family:system-ui,sans-serif; padding:20px; }
  h1 { font-size:20px; color:#00E676; }
  iframe { border:1px solid #223; background:#0A1017; width:1400px; height:600px; }
  pre { background:#0E1621; padding:16px; border-radius:10px; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Prueba de temas 🎨</h1>
<p>Comprueba que cada paleta se aplica a toda la web, que se recuerda al cambiar de página,
   que el texto se LEE bien en todas (contraste) y que las paletas de siempre siguen
   intactas. Al terminar deja el tema como estaba.</p>
<iframe id="marco" src="../ajustes.html"></iframe>
<pre id="resultado">Ejecutando…</pre>

<script>
const salida = [];
function ok(titulo, bien, extra) {
  salida.push((bien ? '[OK   ] ' : '[FALLO] ') + titulo + (extra ? '  → ' + extra : ''));
}
const esperar = ms => new Promise(r => setTimeout(r, ms));

function esperarListo(marco, intentos = 200) {
  return new Promise((resolver, rechazar) => {
    let n = 0;
    const tic = setInterval(() => {
      let listo = false;
      try { listo = marco.contentWindow.__listo === true; } catch (e) {}
      if (listo) { clearInterval(tic); resolver(); }
      else if (++n > intentos) { clearInterval(tic); rechazar(new Error('la pantalla no cargó')); }
    }, 100);
  });
}

function navegar(marco, url) {
  return new Promise((resolver, rechazar) => {
    const alCargar = async () => {
      marco.removeEventListener('load', alCargar);
      try { await esperarListo(marco); await esperar(250); resolver(); }
      catch (e) { rechazar(e); }
    };
    marco.addEventListener('load', alCargar);
    marco.contentWindow.location.href = url;
  });
}

/* ---------- utilidades de color (para medir el contraste de verdad) ---------- */
function aRgb(css) {
  css = String(css || '').trim();
  if (css.startsWith('#')) {
    const h = css.slice(1);
    const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
  }
  const m = css.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  return m ? [+m[1], +m[2], +m[3]] : null;
}
function luminancia(rgb) {
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
/* Devuelve el contraste (1 = igual, 21 = blanco sobre negro) */
function contraste(c1, c2) {
  const a = luminancia(aRgb(c1)), b = luminancia(aRgb(c2));
  const hi = Math.max(a, b), lo = Math.min(a, b);
  return (hi + 0.05) / (lo + 0.05);
}
const dosDec = n => (Math.round(n * 100) / 100).toString();

const COLORES_ESPERADOS = {
  verde:     '#00e676',
  morado:    '#7c3aed',
  champions: '#e3b23c',
  azul:      '#22d3ee',
  atardecer: '#f97316',
  synthwave: '#ff3cac',
  aurora:    '#2dd4bf',
  esports:   '#c6ff00'
};

const NOMBRES_ESPERADOS = {
  verde: 'Verde neón',
  morado: 'Morado',
  champions: 'Champions',
  azul: 'Azul eléctrico',
  atardecer: 'Atardecer',
  synthwave: 'Synthwave',
  aurora: 'Aurora',
  esports: 'Esports'
};

function fondoDe(d) { return d.defaultView.getComputedStyle(d.body).backgroundColor; }
function acentoDe(d) {
  return d.defaultView.getComputedStyle(d.documentElement).getPropertyValue('--neon').trim();
}
function varDe(d, nombre) {
  return d.defaultView.getComputedStyle(d.documentElement).getPropertyValue(nombre).trim();
}

const marcoEl = document.getElementById('marco');
marcoEl.onload = async function ejecutarPrueba() {
  marcoEl.onload = null;
  const marco = marcoEl;
  let temaAntes = null;

  try {
    await esperarListo(marco);
    let w = marco.contentWindow;
    let d = marco.contentDocument;

    temaAntes = w.temaActual();

    // 1. El selector está en Ajustes, con todas las paletas
    // (Las claves se leen de la clase de cada bolita: es lo que pinta el selector)
    const claves = Array.from(d.querySelectorAll('#selector-tema .tema-bola'))
      .map(s => s.className.replace('tema-bola', '').trim());
    const opciones = d.querySelectorAll('#selector-tema .tema-opcion');
    const esperadas = Object.keys(NOMBRES_ESPERADOS);   // las paletas que DEBE haber
    ok('el selector ofrece todas las paletas (' + esperadas.length + ')',
       opciones.length === esperadas.length && claves.length === esperadas.length,
       opciones.length + ' opciones');
    ok('salen todos los nombres en el selector',
       esperadas.every(k => claves.includes(k)) &&
       claves.every(k => d.getElementById('selector-tema').textContent.includes(NOMBRES_ESPERADOS[k])),
       claves.map(k => NOMBRES_ESPERADOS[k]).join(' · '));
    ok('cada paleta tiene su color de acento declarado en la prueba',
       esperadas.every(k => COLORES_ESPERADOS[k]), esperadas.join(', '));

    // 2. Estado de partida
    ok('el tema activo está marcado en el selector',
       !!d.querySelector('#selector-tema .tema-opcion.activo'),
       'tema actual: ' + temaAntes);

    const fondos = {};   // para comprobar luego que cada tema tiene su propio fondo

    // 3. Cada paleta: se aplica, se guarda y SE LEE BIEN
    for (let i = 0; i < claves.length; i++) {
      const clave = claves[i];
      const boton = d.querySelectorAll('#selector-tema .tema-opcion')[i];
      boton.click();
      await esperar(320);

      // 3a. Se aplica al <html> (el verde es el de por defecto: sin atributo)
      const attr = w.document.documentElement.getAttribute('data-tema');
      const esperado = clave === 'verde' ? null : clave;
      ok('[' + clave + '] se aplica el tema en la página', attr === esperado,
         'data-tema=' + (attr === null ? '(por defecto)' : attr));

      // 3b. El acento es el de su paleta
      ok('[' + clave + '] el acento es el suyo (' + COLORES_ESPERADOS[clave] + ')',
         acentoDe(d).toLowerCase() === COLORES_ESPERADOS[clave], acentoDe(d));

      // 3c. Se recuerda en el navegador
      // (Con el tema por defecto ya puesto no se escribe nada: eso es correcto,
      //  así que ahí se acepta que no haya nada guardado)
      const guardado = w.localStorage.getItem('tema-web');
      ok('[' + clave + '] el tema se recuerda en el navegador',
         guardado === clave || (clave === 'verde' && guardado === null),
         'tema-web=' + guardado);

      // 3d. LO IMPORTANTE: el texto se lee bien (contraste real, como lo mide la norma)
      const texto = varDe(d, '--texto'), fondo = varDe(d, '--bg'), panel = varDe(d, '--panel');
      const texto2 = varDe(d, '--texto-2'), acento = varDe(d, '--neon'), sobreAcento = varDe(d, '--sobre-acento');
      const cTexto = contraste(texto, fondo);
      const cTextoPanel = contraste(texto, panel);
      const cSecundario = contraste(texto2, panel);
      const cBoton = contraste(sobreAcento, acento);

      ok('[' + clave + '] el texto principal se lee sobre el fondo (' + dosDec(cTexto) + ':1)',
         cTexto >= 4.5, texto + ' sobre ' + fondo);
      ok('[' + clave + '] el texto principal se lee sobre las tarjetas (' + dosDec(cTextoPanel) + ':1)',
         cTextoPanel >= 4.5, texto + ' sobre ' + panel);
      ok('[' + clave + '] el texto secundario se lee (' + dosDec(cSecundario) + ':1)',
         cSecundario >= 4.5, texto2 + ' sobre ' + panel);
      ok('[' + clave + '] el texto de los botones se lee (' + dosDec(cBoton) + ':1)',
         cBoton >= 4.5, sobreAcento + ' sobre ' + acento);

      fondos[clave] = fondoDe(d);
    }

    // 3e. Cada tema tiene su propio fondo (ninguno se ha quedado sin cambiar)
    const unicos = new Set(Object.values(fondos));
    ok('cada paleta tiene su propio fondo', unicos.size === claves.length,
       Object.entries(fondos).map(([k, v]) => k + '=' + v).join(' · '));

    // 4. Al cambiar de página, el tema aguanta (se aplica antes de pintar)
    //    (El bucle ha dejado puesto el último de la lista)
    const ultima = claves[claves.length - 1];
    await navegar(marco, '../partidos.html');
    w = marco.contentWindow;
    d = marco.contentDocument;
    ok('al cambiar de página el tema sigue puesto (sin parpadeo)',
       w.document.documentElement.getAttribute('data-tema') === ultima &&
       acentoDe(d).toLowerCase() === COLORES_ESPERADOS[ultima],
       'tema ' + ultima + ' · acento en Partidos: ' + acentoDe(d));

    // 5. Los DOS temas de siempre siguen igual que antes
    await navegar(marco, '../ajustes.html');
    w = marco.contentWindow;
    d = marco.contentDocument;

    const botones = () => Array.from(d.querySelectorAll('#selector-tema .tema-opcion'));
    const porClave = clave => botones()[claves.indexOf(clave)];

    porClave('morado').click();
    await esperar(320);
    ok('el Morado sigue con su violeta (#7C3AED)',
       acentoDe(d).toLowerCase() === '#7c3aed' && !!fondoDe(d), acentoDe(d));

    await navegar(marco, '../partidos.html');
    d = marco.contentDocument;
    const colorFiltro = f => d.defaultView.getComputedStyle(d.querySelector('.tab[data-filtro="' + f + '"]')).color;
    ok('en la paleta morada los filtros van con tonos más apagados',
       colorFiltro('pendientes') === 'rgb(217, 119, 6)' &&
       colorFiltro('jugados') === 'rgb(5, 150, 105)' &&
       colorFiltro('proximos') === 'rgb(96, 165, 250)',
       'pendientes ' + colorFiltro('pendientes') + ' · jugados ' + colorFiltro('jugados') + ' · curso ' + colorFiltro('proximos'));

    await navegar(marco, '../clasificacion.html');
    d = marco.contentDocument;
    const medallas = d.querySelectorAll('#tabla-clasificacion .pos .medalla');
    ok('la clasificación enseña las insignias 🥇🥈🥉', medallas.length === 3,
       Array.from(medallas).map(m => m.textContent).join(' ') || 'ninguna');

    const colorTexto = nodo => d.defaultView.getComputedStyle(nodo).color;
    const colorPos = i => colorTexto(d.querySelectorAll('#tabla-clasificacion tbody tr')[i].querySelector('td.pos'));
    ok('el podio usa los metales sobrios de esta paleta',
       colorPos(0) === 'rgb(233, 168, 0)' && colorPos(1) === 'rgb(185, 190, 198)' && colorPos(2) === 'rgb(185, 113, 58)',
       [colorPos(0), colorPos(1), colorPos(2)].join('  '));

    const recuadrosClas = Array.from(d.querySelectorAll('#resumen .dato .valor')).map(colorTexto);
    ok('los recuadros de la clasificación cambian de tono con la paleta',
       recuadrosClas.length === 4 && new Set(recuadrosClas).size === 4 &&
       recuadrosClas[0] === 'rgb(5, 150, 105)',
       recuadrosClas.join('  '));

    // 6. Volver al tema de siempre
    await navegar(marco, '../ajustes.html');
    w = marco.contentWindow;
    d = marco.contentDocument;
    porClave('verde').click();
    await esperar(320);

    ok('se puede volver al tema verde neón',
       !w.document.documentElement.hasAttribute('data-tema'), 'sin data-tema (tema por defecto)');
    ok('la paleta verde sigue siendo la de siempre (#00E676)',
       acentoDe(d).toLowerCase() === '#00e676', acentoDe(d));
    ok('el fondo vuelve al azul noche',
       fondoDe(d) === fondos['verde'], 'fondo: ' + fondoDe(d));

  } catch (e) {
    salida.push('[EXCEPCIÓN] ' + e.message);
  }

  // Se deja el tema como estaba antes de la prueba
  try {
    marco.contentWindow.aplicarTema(temaAntes || 'verde');
  } catch (e) {}

  const fallos = salida.filter(l => l.startsWith('[FALLO') || l.startsWith('[EXCE')).length;
  document.getElementById('resultado').textContent =
    salida.join('\n') + '\n\n' + (fallos === 0 ? '✅ PRUEBA COMPLETA: TODO CORRECTO' : '❌ ' + fallos + ' fallos');
  document.title = fallos === 0 ? 'PRUEBA-OK' : 'PRUEBA-FALLIDA';
};
</script>
</body>
</html>
