<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis torneos · Torneo eFootball</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/tema.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="marca">
      <span class="balon">⚽</span>
      <h1>Torneo <span>eFootball</span></h1>
    </div>

    <div class="topbar-centro">
      <span class="nombre-torneo" id="cuenta-torneos"></span>
    </div>

    <div class="topbar-derecha">
      <span class="nota" id="nota-guardado"></span>
      <!-- Ajustes desde aquí: abre el último torneo que usaste (o el de crear uno) -->
      <a class="btn-actualizar" id="btn-ajustes" href="ajustes.html"
         title="Ajustes del torneo y aspecto de la web">⚙️ <span>Ajustes</span></a>
    </div>
  </header>

  <div class="layout layout-simple">
    <main class="contenido">

      <header class="panel-cabecera">
        <h2>Mis <em>torneos</em></h2>
        <p>Elige un torneo para ver su clasificación, sus partidos o cambiar sus ajustes. Puedes tener todos los que quieras.</p>
      </header>

      <div class="zona-acciones">
        <button class="btn btn-gol solo-edicion" id="btn-nuevo-torneo">Crear torneo nuevo</button>
      </div>

      <!-- Entrar en un torneo con su código (tipo código de sala de un juego) -->
      <div class="caja-codigo">
        <div>
          <span class="etiqueta-codigo">🎫 ¿Te han pasado un código de torneo?</span>
          <small>Escríbelo aquí y entras directo. Si te han mandado el enlace entero, pégalo y también vale.</small>
        </div>
        <div class="caja-codigo-forma">
          <input id="codigo-a-buscar" type="text" placeholder="K7M2QX" maxlength="60"
                 autocomplete="off" spellcheck="false" aria-label="Código del torneo">
          <button class="btn btn-gol" id="btn-buscar-codigo">Entrar</button>
        </div>
      </div>

      <div class="rejilla-torneos" id="lista-torneos"></div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/config-nube.js"></script>
  <script src="js/modelo.js"></script>
  <script src="js/datos-prueba.js"></script>
  <script src="js/store.js"></script>
  <script src="js/candado.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/torneos.js"></script>
</body>
</html>
